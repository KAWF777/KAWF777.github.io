<section class="reading"><p class="eyebrow">ABOUT / 关于这里</p><h1>你好，这里是 koon 的博客。</h1><div class="prose"><p>这是一个以文字为主的个人空间，用来收集日常的片段，也留住思考的过程。</p><p>不必每次都有完整的答案。一个问题，一段读后感，或是平凡日子里的小小发现，都可以成为一篇文章的起点。</p><h2>慢慢写，也慢慢读</h2><p>你可以在「文章」里阅读最近的记录，也可以到「归档」中按时间翻阅。喜欢这里的话，可以通过页脚的 RSS 订阅更新。</p><h2>关于回复</h2><p>文章末尾已经为交流留好了位置。第一版的回复功能暂未开放，无法填写或提交，后续会继续完善。</p><p>谢谢你来读。</p></div></section>
